<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة عصر الاحتراف</title>
<style>
*{
box-sizing:border-box;
}
body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#080808;
color:#fff;
padding:30px 15px;
}
.container{
max-width:900px;
margin:auto;
}
h1{
text-align:center;
margin-bottom:30px;
}
h1 span{
color:#ff6900;
}
.card{
background:#151515;
border-radius:16px;
padding:22px;
margin-bottom:18px;
}
input{
width:100%;
padding:14px;
margin-bottom:12px;
background:#0c0c0c;
color:#fff;
border:1px solid #333;
border-radius:9px;
font-size:16px;
}
button{
padding:13px 22px;
border:0;
border-radius:9px;
background:#ff6900;
color:#fff;
font-weight:bold;
cursor:pointer;
}
button:hover{
opacity:.85;
}
#adminPanel{
display:none;
}
.registration{
border-radius:15px;
padding:20px;
margin-bottom:15px;
}
.new{
background:#3d0b0b;
border:2px solid #ff3333;
}
.accepted{
background:#073d20;
border:2px solid #00c853;
}
.rejected{
background:#292929;
border:2px solid #777;
}
.status{
font-weight:bold;
margin-top:12px;
}
.new .status{
color:#ff3333;
}
.accepted .status{
color:#00c853;
}
.rejected .status{
color:#aaa;
}
.actions{
display:flex;
gap:10px;
margin-top:18px;
flex-wrap:wrap;
}
.acceptBtn{
background:#00c853;
}
.rejectBtn{
background:#d50000;
}
.logout{
background:#292929;
margin-bottom:20px;
}
</style>
</head>
<body>
<div class="container">
<h1>
إدارة <span>عصر الاحتراف 🔐</span>
</h1>
<!-- تسجيل الدخول -->
<div id="loginBox" class="card">
<h2>
تسجيل دخول الأدمن
</h2>
<input
id="adminEmail"
type="email"
placeholder="إيميل الأدمن"
>
<input
id="adminPassword"
type="password"
placeholder="كلمة المرور"
>
<button id="loginBtn">
دخول
</button>
<p id="loginMessage"></p>
</div>
<!-- لوحة الإدارة -->
<div id="adminPanel">
<button class="logout" id="logoutBtn">
تسجيل الخروج
</button>
<h2>
طلبات التسجيل
</h2>
<div id="registrations">
جاري تحميل الطلبات...
</div>
</div>
</div>
<script type="module">
import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const SUPABASE_URL =
"https://ybbyvxpvblbnhqmkfxvw.supabase.co";
const SUPABASE_KEY =
"sb_publishable_zLOmmutAi-0PJ5xDqGzJug_Z4KtLLoW";
const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);
const loginBtn =
document.getElementById("loginBtn");
const logoutBtn =
document.getElementById("logoutBtn");
const loginBox =
document.getElementById("loginBox");
const adminPanel =
document.getElementById("adminPanel");
// ========================================
// التحقق من تسجيل الدخول
// ========================================
async function checkSession(){
const {
data:{
session
}
} =
await supabase.auth.getSession();
if(session){
loginBox.style.display = "none";
adminPanel.style.display = "block";
await loadRegistrations();
}else{
loginBox.style.display = "block";
adminPanel.style.display = "none";
}
}
// ========================================
// تسجيل الدخول
// ========================================
loginBtn.addEventListener("click", async () => {
const email =
document
.getElementById("adminEmail")
.value
.trim();
const password =
document
.getElementById("adminPassword")
.value;
const loginMessage =
document.getElementById("loginMessage");
loginMessage.style.color =
"#ff6900";
loginMessage.innerText =
"جاري تسجيل الدخول...";
const {
data,
error
} =
await supabase.auth.signInWithPassword({
email:email,
password:password
});
if(error){
console.error(error);
loginMessage.style.color =
"#ff3333";
loginMessage.innerText =
"بيانات الدخول غير صحيحة ❌";
return;
}
loginMessage.style.color =
"#00c853";
loginMessage.innerText =
"تم تسجيل الدخول ✅";
loginBox.style.display =
"none";
adminPanel.style.display =
"block";
await loadRegistrations();
});
// ========================================
// تسجيل الخروج
// ========================================
logoutBtn.addEventListener("click", async () => {
await supabase.auth.signOut();
loginBox.style.display =
"block";
adminPanel.style.display =
"none";
});
// ========================================
// تحميل الطلبات
// ========================================
async function loadRegistrations(){
const container =
document.getElementById("registrations");
container.innerHTML =
"جاري تحميل الطلبات...";
const {
data,
error
} =
await supabase
.from("registration")
.select("*")
.order("id", {
ascending:false
});
if(error){
console.error(error);
container.innerHTML =
"حدث خطأ أثناء تحميل الطلبات ❌";
return;
}
if(!data || data.length === 0){
container.innerHTML =
"لا توجد طلبات حتى الآن.";
return;
}
container.innerHTML =
data.map(item => {
let cardClass = "new";
let statusText =
"🔴 طلب جديد";
if(item.status === "accepted"){
cardClass = "accepted";
statusText =
"🟢 تم قبول اللاعب";
}
else if(item.status === "rejected"){
cardClass = "rejected";
statusText =
"❌ تم رفض اللاعب";
}
return `
<div class="registration ${cardClass}">
<h3>
${item.player_name || "بدون اسم"}
</h3>
<p>
العمر:
${item.age || "-"}
</p>
<p>
ولي الأمر:
${item.guardian_name || "-"}
</p>
<p>
الجوال:
${item.phone || "-"}
</p>
<p>
الملاحظات:
${item.notes || "لا يوجد"}
</p>
<p class="status">
${statusText}
</p>
${
item.status !== "accepted" &&
item.status !== "rejected"
?
`
<div class="actions">
<button
class="acceptBtn"
onclick="acceptRegistration('${item.id}')"
>
🟢 قبول اللاعب
</button>
<button
class="rejectBtn"
onclick="rejectRegistration('${item.id}')"
>
🔴 رفض الطلب
</button>
</div>
`
:
""
}
</div>
`;
}).join("");
}
// ========================================
// قبول اللاعب
// ========================================
window.acceptRegistration =
async function(id){
const {
error
} =
await supabase
.from("registration")
.update({
status:"accepted"
})
.eq("id",id);
if(error){
console.error(error);
alert(
"حدث خطأ أثناء قبول اللاعب ❌"
);
return;
}
await loadRegistrations();
};
// ========================================
// رفض اللاعب
// ========================================
window.rejectRegistration =
async function(id){
const confirmReject =
confirm(
"هل أنت متأكد من رفض هذا الطلب؟"
);
if(!confirmReject){
return;
}
const {
error
} =
await supabase
.from("registration")
.update({
status:"rejected"
})
.eq("id",id);
if(error){
console.error(error);
alert(
"حدث خطأ أثناء رفض الطلب ❌"
);
return;
}
await loadRegistrations();
};
// ========================================
// تشغيل الصفحة
// ========================================
checkSession();
</script>
</body>
</html>
