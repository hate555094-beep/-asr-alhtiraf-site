
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة عصر الاحتراف</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:linear-gradient(135deg,#f7f9fc,#ffffff);
color:#222;
padding:30px 15px;
min-height:100vh;
}

.container{
max-width:950px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:30px;
}

h1 span{
color:#ff6900;
}

.card{
background:#fff;
border:1px solid #eee;
border-radius:20px;
padding:25px;
margin-bottom:20px;
box-shadow:0 10px 35px rgba(0,0,0,.08);
}

input{
width:100%;
padding:15px;
margin-bottom:14px;
background:#f8f9fa;
color:#222;
border:1px solid #ddd;
border-radius:11px;
font-size:16px;
outline:none;
}

input:focus{
border-color:#ff6900;
}

button{
padding:13px 20px;
border:0;
border-radius:10px;
font-weight:bold;
cursor:pointer;
font-size:15px;
}

button:hover{
opacity:.85;
}

#adminPanel{
display:none;
}

.loginButton{
width:100%;
background:#ff6900;
color:white;
font-size:17px;
}

.logoutButton{
background:#333;
color:white;
margin-bottom:20px;
}


/* =========================
   الإحصائيات
========================= */

.stats{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-bottom:25px;
}

.stat{
background:#fff;
border:1px solid #eee;
border-radius:18px;
padding:20px;
text-align:center;
box-shadow:0 6px 20px rgba(0,0,0,.05);
}

.statNumber{
font-size:30px;
font-weight:bold;
color:#ff6900;
}

.statTitle{
color:#777;
margin-top:5px;
}


/* =========================
   قوائم الأقسام
========================= */

.sections{
display:flex;
flex-direction:column;
gap:12px;
}

.sectionBox{
background:#fff;
border:1px solid #eee;
border-radius:16px;
overflow:hidden;
box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.sectionButton{
width:100%;
background:#fff;
color:#222;
padding:18px 20px;
display:flex;
align-items:center;
justify-content:space-between;
text-align:right;
font-size:17px;
transition:.2s;
}

.sectionButton:hover{
opacity:1;
background:#fafafa;
}

.sectionRight{
display:flex;
align-items:center;
gap:12px;
}

.sectionIcon{
font-size:21px;
}

.sectionName{
font-weight:bold;
}

.sectionCount{
min-width:32px;
height:32px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
background:#ff6900;
color:white;
font-size:14px;
}

.sectionArrow{
font-size:18px;
transition:.2s;
}

.sectionBox.open .sectionArrow{
transform:rotate(180deg);
}

.sectionContent{
display:none;
padding:15px;
border-top:1px solid #eee;
background:#fafafa;
}

.sectionBox.open .sectionContent{
display:block;
}


/* ألوان الأقسام */

.pendingBox{
border-right:4px solid #ff3333;
}

.acceptedBox{
border-right:4px solid #00c853;
}

.rejectedBox{
border-right:4px solid #777;
}


/* =========================
   بطاقة اللاعب
========================= */

.registration{
background:#fff;
border:1px solid #eee;
border-radius:18px;
padding:20px;
margin-bottom:15px;
box-shadow:0 6px 20px rgba(0,0,0,.05);
}

.registration:last-child{
margin-bottom:0;
}

.registration.new{
border-right:5px solid #ff3333;
}

.registration.accepted{
border-right:5px solid #00c853;
}

.registration.rejected{
border-right:5px solid #777;
}

.registration h3{
margin-top:0;
font-size:21px;
}

.info{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(200px,1fr));
gap:10px;
}

.infoBox{
background:#f8f9fa;
border-radius:10px;
padding:12px;
}

.infoBox strong{
display:block;
margin-bottom:5px;
}

.infoBox span{
color:#666;
}

.status{
font-weight:bold;
margin-top:18px;
}

.new .status{
color:#d40000;
}

.accepted .status{
color:#00a844;
}

.rejected .status{
color:#777;
}

.actions{
display:flex;
gap:10px;
margin-top:18px;
flex-wrap:wrap;
}

.acceptButton{
background:#00c853;
color:white;
}

.rejectButton{
background:#d40000;
color:white;
}

.deleteButton{
background:#555;
color:white;
}

.empty{
text-align:center;
padding:25px 10px;
color:#777;
}


/* =========================
   مربع تأكيد الحذف
========================= */

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
backdrop-filter:blur(6px);
align-items:center;
justify-content:center;
z-index:9999;
padding:20px;
}

.modalBox{
width:100%;
max-width:420px;
background:white;
border-radius:22px;
padding:30px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.modalIcon{
font-size:55px;
margin-bottom:10px;
}

.modalBox h2{
margin:0 0 10px;
}

.modalBox p{
color:#777;
line-height:1.8;
}

.modalButtons{
display:flex;
gap:10px;
margin-top:25px;
}

.modalButtons button{
flex:1;
}

.cancelButton{
background:#eee;
color:#333;
}

.confirmDeleteButton{
background:#d40000;
color:white;
}


/* =========================
   الجوال
========================= */

@media(max-width:600px){

body{
padding:20px 10px;
}

.card{
padding:18px;
}

.actions button{
flex:1;
}

.modalButtons{
flex-direction:column;
}

.sectionButton{
padding:16px;
}

}

</style>

</head>


<body>


<div class="container">


<!-- =========================
     تسجيل الدخول
========================= -->

<div id="loginBox" class="card">

<h1>
إدارة <span>عصر الاحتراف 🔐</span>
</h1>

<p style="text-align:center;color:#777;">
تسجيل دخول لوحة الإدارة
</p>


<input
id="adminEmail"
type="email"
placeholder="إيميل الأدمن"
>


<input
id="adminPassword"
type="password"
placeholder="كلمة المرور"
>


<button
id="loginBtn"
class="loginButton"
>
دخول
</button>


<p
id="loginMessage"
style="text-align:center;font-weight:bold;"
></p>

</div>



<!-- =========================
     لوحة الإدارة
========================= -->

<div id="adminPanel">


<h1>
لوحة تحكم
<span>عصر الاحتراف ⚽</span>
</h1>


<button
id="logoutBtn"
class="logoutButton"
>
تسجيل الخروج
</button>


<!-- الإحصائيات -->

<div class="stats">


<div class="stat">

<div
id="totalCount"
class="statNumber"
>
0
</div>

<div class="statTitle">
إجمالي الطلبات
</div>

</div>


<div class="stat">

<div
id="pendingCount"
class="statNumber"
>
0
</div>

<div class="statTitle">
طلبات جديدة
</div>

</div>


<div class="stat">

<div
id="acceptedCount"
class="statNumber"
>
0
</div>

<div class="statTitle">
المقبولين
</div>

</div>


<div class="stat">

<div
id="rejectedCount"
class="statNumber"
>
0
</div>

<div class="statTitle">
المرفوضين
</div>

</div>


</div>



<!-- =========================
     الأقسام
========================= -->

<div class="sections">


<!-- الطلبات الجديدة -->

<div class="sectionBox pendingBox">

<button
class="sectionButton"
onclick="toggleSection('pendingBox')"
>

<div class="sectionRight">

<span class="sectionIcon">
🔴
</span>

<span class="sectionName">
طلبات جديدة
</span>

<span
id="pendingSectionCount"
class="sectionCount"
>
0
</span>

</div>

<span class="sectionArrow">
⌄
</span>

</button>


<div
id="pendingBox"
class="sectionContent"
>

<div id="pendingRegistrations">

جاري تحميل الطلبات...

</div>

</div>

</div>



<!-- المقبولون -->

<div class="sectionBox acceptedBox">

<button
class="sectionButton"
onclick="toggleSection('acceptedBox')"
>

<div class="sectionRight">

<span class="sectionIcon">
🟢
</span>

<span class="sectionName">
المقبولون
</span>

<span
id="acceptedSectionCount"
class="sectionCount"
>
0
</span>

</div>

<span class="sectionArrow">
⌄
</span>

</button>


<div
id="acceptedBox"
class="sectionContent"
>

<div id="acceptedRegistrations">

جاري تحميل الطلبات...

</div>

</div>

</div>



<!-- المرفوضون -->

<div class="sectionBox rejectedBox">

<button
class="sectionButton"
onclick="toggleSection('rejectedBox')"
>

<div class="sectionRight">

<span class="sectionIcon">
❌
</span>

<span class="sectionName">
المرفوضون
</span>

<span
id="rejectedSectionCount"
class="sectionCount"
>
0
</span>

</div>

<span class="sectionArrow">
⌄
</span>

</button>


<div
id="rejectedBox"
class="sectionContent"
>

<div id="rejectedRegistrations">

جاري تحميل الطلبات...

</div>

</div>

</div>


</div>


</div>


</div>



<!-- =========================
     مربع تأكيد الحذف
========================= -->

<div
id="confirmModal"
class="modal"
>

<div class="modalBox">


<div class="modalIcon">
⚠️
</div>


<h2>
تأكيد الحذف
</h2>


<p>
هل أنت متأكد أنك تريد حذف هذا الطلب نهائيًا؟
</p>


<div class="modalButtons">


<button
id="cancelDelete"
class="cancelButton"
>
إلغاء
</button>


<button
id="confirmDelete"
class="confirmDeleteButton"
>
نعم، احذف
</button>


</div>


</div>

</div>



<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =========================
   Supabase
========================= */

const SUPABASE_URL =
"https://ybbyvxpvblbnhqmkfxvw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_zLOmmutAi-0PJ5xDqGzJug_Z4KtLLoW";

const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   العناصر
========================= */

const loginBox =
document.getElementById("loginBox");

const adminPanel =
document.getElementById("adminPanel");

const loginBtn =
document.getElementById("loginBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const confirmModal =
document.getElementById("confirmModal");

const cancelDelete =
document.getElementById("cancelDelete");

const confirmDelete =
document.getElementById("confirmDelete");


let deleteId = null;


/* =========================
   فتح وإغلاق الأقسام
========================= */

window.toggleSection =
function(sectionId){

const box =
document.getElementById(sectionId);

box.parentElement.classList.toggle(
"open"
);

};


/* =========================
   فحص تسجيل الدخول
========================= */

async function checkSession(){

const {
data:{
session
}
} =
await supabase.auth.getSession();


if(session){

loginBox.style.display =
"none";

adminPanel.style.display =
"block";

await loadRegistrations();

}else{

loginBox.style.display =
"block";

adminPanel.style.display =
"none";

}

}


/* =========================
   تسجيل الدخول
========================= */

loginBtn.addEventListener(
"click",
async function(){

const email =
document
.getElementById("adminEmail")
.value
.trim();

const password =
document
.getElementById("adminPassword")
.value;

const message =
document.getElementById(
"loginMessage"
);


message.style.color =
"#ff6900";

message.innerText =
"جاري تسجيل الدخول...";


const {
error
} =
await supabase.auth.signInWithPassword({

email:email,

password:password

});


if(error){

console.error(error);

message.style.color =
"#d40000";

message.innerText =
"بيانات الدخول غير صحيحة ❌";

return;

}


message.style.color =
"#00a844";

message.innerText =
"تم تسجيل الدخول ✅";


loginBox.style.display =
"none";

adminPanel.style.display =
"block";


await loadRegistrations();

});


/* =========================
   تسجيل الخروج
========================= */

logoutBtn.addEventListener(
"click",
async function(){

await supabase.auth.signOut();

loginBox.style.display =
"block";

adminPanel.style.display =
"none";

});


/* =========================
   تحميل الطلبات
========================= */

async function loadRegistrations(
keepPosition = false
){

const oldPosition =
window.scrollY;


const pendingContainer =
document.getElementById(
"pendingRegistrations"
);

const acceptedContainer =
document.getElementById(
"acceptedRegistrations"
);

const rejectedContainer =
document.getElementById(
"rejectedRegistrations"
);


pendingContainer.innerHTML =
"جاري التحميل...";

acceptedContainer.innerHTML =
"جاري التحميل...";

rejectedContainer.innerHTML =
"جاري التحميل...";


const {
data,
error
} =
await supabase
.from("registration")
.select("*")
.order("id",{
ascending:false
});


if(error){

console.error(error);

pendingContainer.innerHTML =
`
<div class="empty">
تعذر تحميل الطلبات ❌
</div>
`;

return;

}


/* =========================
   تقسيم الطلبات
========================= */

const pending =
data.filter(
item =>
!item.status ||
item.status === "pending"
);

const accepted =
data.filter(
item =>
item.status === "accepted"
);

const rejected =
data.filter(
item =>
item.status === "rejected"
);


/* =========================
   الإحصائيات
========================= */

document.getElementById(
"totalCount"
).innerText =
data.length;

document.getElementById(
"pendingCount"
).innerText =
pending.length;

document.getElementById(
"acceptedCount"
).innerText =
accepted.length;

document.getElementById(
"rejectedCount"
).innerText =
rejected.length;


document.getElementById(
"pendingSectionCount"
).innerText =
pending.length;

document.getElementById(
"acceptedSectionCount"
).innerText =
accepted.length;

document.getElementById(
"rejectedSectionCount"
).innerText =
rejected.length;


/* =========================
   إنشاء بطاقة اللاعب
========================= */

function createRegistrationCard(
item,
type
){

return `

<div class="registration ${type}">

<h3>
👤 ${item.player_name || "بدون اسم"}
</h3>


<div class="info">


<div class="infoBox">

<strong>
🎂 تاريخ الميلاد
</strong>

<span>
${item.birth_date || "-"}
</span>

</div>


<div class="infoBox">

<strong>
العمر
</strong>

<span>
${item.age || "-"}
</span>

</div>


<div class="infoBox">

<strong>
👨‍👦 ولي الأمر
</strong>

<span>
${item.guardian_name || "-"}
</span>

</div>


<div class="infoBox">

<strong>
📱 الجوال
</strong>

<span>
${item.phone || "-"}
</span>

</div>


<div class="infoBox">

<strong>
📝 الملاحظات
</strong>

<span>
${item.notes || "لا يوجد"}
</span>

</div>


</div>


<p class="status">

${
type === "new"
?
"🔴 طلب جديد"
:
type === "accepted"
?
"🟢 تم قبول اللاعب"
:
"❌ تم رفض اللاعب"
}

</p>


<div class="actions">


${
type !== "accepted"

?

`

<button
class="acceptButton"
onclick="acceptRegistration('${item.id}')"
>
🟢 قبول اللاعب
</button>

`

:

""

}


${
type !== "rejected"

?

`

<button
class="rejectButton"
onclick="rejectRegistration('${item.id}')"
>
🔴 رفض الطلب
</button>

`

:

""

}


<button
class="deleteButton"
onclick="deleteRegistration('${item.id}')"
>
🗑️ حذف
</button>


</div>


</div>

`;

}


/* =========================
   عرض الطلبات
========================= */

if(pending.length){

pendingContainer.innerHTML =
pending
.map(
item =>
createRegistrationCard(
item,
"new"
)
)
.join("");

}else{

pendingContainer.innerHTML =
`
<div class="empty">
لا توجد طلبات جديدة 📭
</div>
`;

}


if(accepted.length){

acceptedContainer.innerHTML =
accepted
.map(
item =>
createRegistrationCard(
item,
"accepted"
)
)
.join("");

}else{

acceptedContainer.innerHTML =
`
<div class="empty">
لا يوجد لاعبون مقبولون حاليًا.
</div>
`;

}


if(rejected.length){

rejectedContainer.innerHTML =
rejected
.map(
item =>
createRegistrationCard(
item,
"rejected"
)
)
.join("");

}else{

rejectedContainer.innerHTML =
`
<div class="empty">
لا توجد طلبات مرفوضة حاليًا.
</div>
`;

}


/* =========================
   إرجاع مكان الصفحة
========================= */

if(keepPosition){

requestAnimationFrame(
function(){

window.scrollTo(
0,
oldPosition
);

}
);

}

}


/* =========================
   قبول اللاعب
========================= */

window.acceptRegistration =
async function(id){

const {
error
} =
await supabase
.from("registration")
.update({
status:"accepted"
})
.eq("id",id);


if(error){

console.error(error);

alert(
"تعذر قبول اللاعب ❌"
);

return;

}


await loadRegistrations(true);

};


/* =========================
   رفض اللاعب
========================= */

window.rejectRegistration =
async function(id){

const {
error
} =
await supabase
.from("registration")
.update({
status:"rejected"
})
.eq("id",id);


if(error){

console.error(error);

alert(
"تعذر رفض الطلب ❌"
);

return;

}


await loadRegistrations(true);

};


/* =========================
   فتح مربع الحذف
========================= */

window.deleteRegistration =
function(id){

deleteId = id;

confirmModal.style.display =
"flex";

};


/* =========================
   إلغاء الحذف
========================= */

cancelDelete.addEventListener(
"click",
function(){

deleteId = null;

confirmModal.style.display =
"none";

});


/* =========================
   تأكيد الحذف
========================= */

confirmDelete.addEventListener(
"click",
async function(){

if(!deleteId){

return;

}


const id =
deleteId;


deleteId = null;


confirmModal.style.display =
"none";


const {
error
} =
await supabase
.from("registration")
.delete()
.eq("id",id);


if(error){

console.error(error);

alert(
"تعذر حذف الطلب ❌"
);

return;

}


await loadRegistrations(true);

});


/* =========================
   تشغيل
========================= */

checkSession();


supabase.auth.onAuthStateChange(
(event, session) => {

if(session){

loginBox.style.display =
"none";

adminPanel.style.display =
"block";

}else{

loginBox.style.display =
"block";

adminPanel.style.display =
"none";

}

}
);

</script>


</body>

</html>
```
