```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>لوحة إدارة عصر الاحتراف</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:linear-gradient(135deg,#f7f9fc,#ffffff);
color:#222;
min-height:100vh;
padding:30px 15px;
}

.container{
max-width:1100px;
margin:auto;
}

/* HEADER */

.header{
text-align:center;
margin-bottom:30px;
}

.header .icon{
font-size:45px;
margin-bottom:8px;
}

.header h1{
margin:0;
font-size:32px;
}

.header h1 span{
color:#ff6900;
}

.header p{
color:#777;
margin-top:10px;
}


/* CARD */

.card{
background:#fff;
border:1px solid #eee;
border-radius:20px;
padding:25px;
box-shadow:0 10px 35px rgba(0,0,0,.08);
margin-bottom:20px;
}


/* LOGIN */

.login-card{
max-width:500px;
margin:40px auto;
}

label{
display:block;
font-weight:bold;
margin-bottom:8px;
}

input{
width:100%;
padding:15px;
margin-bottom:16px;
background:#f8f9fa;
color:#222;
border:1px solid #ddd;
border-radius:11px;
font-size:16px;
outline:none;
}

input:focus{
border-color:#ff6900;
background:#fff;
}

button{
border:0;
border-radius:10px;
padding:12px 18px;
font-weight:bold;
cursor:pointer;
font-size:15px;
}

button:hover{
opacity:.88;
}


/* LOGIN BUTTON */

.login-btn{
width:100%;
background:#ff6900;
color:#fff;
padding:15px;
font-size:17px;
}


/* MESSAGE */

#loginMessage{
text-align:center;
font-weight:bold;
}


/* ADMIN */

#adminPanel{
display:none;
}


/* TOP BAR */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
margin-bottom:25px;
}

.topbar h2{
margin:0;
}

.logout{
background:#333;
color:#fff;
}


/* STATS */

.stats{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-bottom:25px;
}

.stat{
background:#fff;
border:1px solid #eee;
border-radius:18px;
padding:22px;
box-shadow:0 8px 25px rgba(0,0,0,.06);
}

.stat .number{
font-size:30px;
font-weight:bold;
margin-bottom:7px;
}

.stat .title{
color:#777;
}

.orange .number{
color:#ff6900;
}

.green .number{
color:#00a844;
}

.red .number{
color:#d40000;
}

.gray .number{
color:#555;
}


/* REQUEST */

.request{
background:#fff;
border:1px solid #eee;
border-radius:18px;
padding:20px;
margin-bottom:15px;
box-shadow:0 6px 20px rgba(0,0,0,.05);
}

.request-header{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:15px;
}

.request h3{
margin:0;
font-size:20px;
}

.badge{
padding:7px 12px;
border-radius:20px;
font-size:13px;
font-weight:bold;
}

.pending{
background:#fff4eb;
color:#d95700;
}

.approved{
background:#e9f9ef;
color:#008f3b;
}

.rejected{
background:#ffeded;
color:#c40000;
}


.info{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(200px,1fr));
gap:10px;
margin-bottom:18px;
}

.info-box{
background:#f8f9fa;
border-radius:10px;
padding:12px;
}

.info-box strong{
display:block;
margin-bottom:5px;
}

.info-box span{
color:#666;
}


.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.accept{
background:#00a844;
color:#fff;
}

.reject{
background:#d40000;
color:#fff;
}

.delete{
background:#555;
color:#fff;
}

.refresh{
background:#ff6900;
color:#fff;
}


/* EMPTY */

.empty{
text-align:center;
padding:40px 20px;
color:#777;
}


/* MOBILE */

@media(max-width:600px){

body{
padding:20px 10px;
}

.card{
padding:18px;
}

.header h1{
font-size:26px;
}

.topbar{
align-items:stretch;
flex-direction:column;
}

.topbar button{
width:100%;
}

.actions button{
flex:1;
min-width:100px;
}

}

</style>

</head>


<body>


<div class="container">


<!-- LOGIN -->

<div id="loginBox"
class="card login-card">

<div class="header">

<div class="icon">
🔐
</div>

<h1>
إدارة
<span>عصر الاحتراف</span>
</h1>

<p>
تسجيل دخول الإدارة
</p>

</div>


<label>
إيميل الأدمن
</label>

<input
id="adminEmail"
type="email"
placeholder="إيميل الأدمن"
>


<label>
كلمة المرور
</label>

<input
id="adminPassword"
type="password"
placeholder="كلمة المرور"
>


<button
id="loginBtn"
class="login-btn"
>
دخول إلى لوحة التحكم
</button>


<p id="loginMessage"></p>

</div>



<!-- ADMIN PANEL -->

<div id="adminPanel">


<div class="header">

<div class="icon">
⚽
</div>

<h1>
لوحة تحكم
<span>عصر الاحتراف</span>
</h1>

<p>
إدارة طلبات اللاعبين
</p>

</div>


<div class="topbar">

<h2>
📋 طلبات التسجيل
</h2>

<div>

<button
id="refreshBtn"
class="refresh"
>
🔄 تحديث
</button>

<button
id="logoutBtn"
class="logout"
>
تسجيل الخروج
</button>

</div>

</div>



<!-- STATS -->

<div class="stats">

<div class="stat orange">

<div
id="totalCount"
class="number"
>
0
</div>

<div class="title">
إجمالي الطلبات
</div>

</div>


<div class="stat">

<div
id="pendingCount"
class="number"
>
0
</div>

<div class="title">
⏳ قيد المراجعة
</div>

</div>


<div class="stat green">

<div
id="approvedCount"
class="number"
>
0
</div>

<div class="title">
🟢 المقبولين
</div>

</div>


<div class="stat red">

<div
id="rejectedCount"
class="number"
>
0
</div>

<div class="title">
🔴 المرفوضين
</div>

</div>

</div>



<div class="card">

<div id="registrations">

جاري تحميل الطلبات...

</div>

</div>


</div>


</div>



<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://ybbyvxpvblbnhqmkfxvw.supabase.co";


const SUPABASE_KEY =
"sb_publishable_zLOmmutAi-0PJ5xDqGzJug_Z4KtLLoW";


const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const loginBox =
document.getElementById(
"loginBox"
);

const adminPanel =
document.getElementById(
"adminPanel"
);

const registrations =
document.getElementById(
"registrations"
);

const loginBtn =
document.getElementById(
"loginBtn"
);

const logoutBtn =
document.getElementById(
"logoutBtn"
);

const refreshBtn =
document.getElementById(
"refreshBtn"
);


// ========================================
// SESSION
// ========================================

async function checkSession(){

const {
data:{
session
}
} =
await supabase.auth.getSession();


if(session){

loginBox.style.display =
"none";

adminPanel.style.display =
"block";

loadRegistrations();

}else{

loginBox.style.display =
"block";

adminPanel.style.display =
"none";

}

}


// ========================================
// LOGIN
// ========================================

loginBtn.addEventListener(
"click",
async function(){

const email =
document
.getElementById(
"adminEmail"
)
.value
.trim();

const password =
document
.getElementById(
"adminPassword"
)
.value;

const message =
document.getElementById(
"loginMessage"
);

message.style.color =
"#ff6900";

message.innerText =
"جاري تسجيل الدخول...";


const {
error
} =
await supabase.auth.signInWithPassword({

email:email,

password:password

});


if(error){

console.error(error);

message.style.color =
"#d40000";

message.innerText =
"بيانات الدخول غير صحيحة ❌";

return;

}


message.innerText = "";

loginBox.style.display =
"none";

adminPanel.style.display =
"block";

loadRegistrations();

});


// ========================================
// LOGOUT
// ========================================

logoutBtn.addEventListener(
"click",
async function(){

await supabase.auth.signOut();

loginBox.style.display =
"block";

adminPanel.style.display =
"none";

});


// ========================================
// REFRESH
// ========================================

refreshBtn.addEventListener(
"click",
function(){

loadRegistrations();

});


// ========================================
// LOAD
// ========================================

async function loadRegistrations(){

registrations.innerHTML =
"جاري تحميل الطلبات...";


const {
data,
error
} =
await supabase
.from("registration")
.select("*")
.order("id",{
ascending:false
});


if(error){

console.error(error);

registrations.innerHTML =
`
<div class="empty">
تعذر تحميل الطلبات ❌
</div>
`;

return;

}


const total =
data.length;

const pending =
data.filter(
item =>
item.status === "pending"
).length;

const approved =
data.filter(
item =>
item.status === "approved"
).length;

const rejected =
data.filter(
item =>
item.status === "rejected"
).length;


document.getElementById(
"totalCount"
).innerText =
total;

document.getElementById(
"pendingCount"
).innerText =
pending;

document.getElementById(
"approvedCount"
).innerText =
approved;

document.getElementById(
"rejectedCount"
).innerText =
rejected;


if(!data.length){

registrations.innerHTML =
`
<div class="empty">
لا توجد طلبات حتى الآن 📭
</div>
`;

return;

}


registrations.innerHTML =
data.map(
item => {

let badge =
"pending";

let badgeText =
"⏳ قيد المراجعة";


if(item.status === "approved"){

badge =
"approved";

badgeText =
"🟢 مقبول";

}


if(item.status === "rejected"){

badge =
"rejected";

badgeText =
"🔴 مرفوض";

}


return `

<div class="request">

<div class="request-header">

<h3>
${item.player_name || "بدون اسم"}
</h3>

<span class="badge ${badge}">
${badgeText}
</span>

</div>


<div class="info">


<div class="info-box">

<strong>
🎂 تاريخ الميلاد
</strong>

<span>
${item.birth_date || "-"}
</span>

</div>


<div class="info-box">

<strong>
👤 العمر
</strong>

<span>
${item.age || "-"}
</span>

</div>


<div class="info-box">

<strong>
👨‍👦 ولي الأمر
</strong>

<span>
${item.guardian_name || "-"}
</span>

</div>


<div class="info-box">

<strong>
📱 الجوال
</strong>

<span>
${item.phone || "-"}
</span>

</div>


<div class="info-box">

<strong>
📝 الملاحظات
</strong>

<span>
${item.notes || "لا يوجد"}
</span>

</div>


</div>


<div class="actions">

${
item.status !== "approved"
?
`
<button
class="accept"
onclick="approveRegistration('${item.id}')"
>
🟢 قبول
</button>
`
:
""
}


${
item.status !== "rejected"
?
`
<button
class="reject"
onclick="rejectRegistration('${item.id}')"
>
🔴 رفض
</button>
`
:
""
}


<button
class="delete"
onclick="deleteRegistration('${item.id}')"
>
🗑️ حذف
</button>

</div>


</div>

`;

}
).join("");

}


// ========================================
// APPROVE
// ========================================

window.approveRegistration =
async function(id){

const confirmApprove =
confirm(
"هل تريد قبول هذا اللاعب؟"
);

if(!confirmApprove){
return;
}


const {
error
} =
await supabase
.from("registration")
.update({

status:"approved"

})
.eq("id",id);


if(error){

console.error(error);

alert(
"تعذر قبول اللاعب ❌"
);

return;

}


loadRegistrations();

};


// ========================================
// REJECT
// ========================================

window.rejectRegistration =
async function(id){

const confirmReject =
confirm(
"هل تريد رفض هذا الطلب؟"
);

if(!confirmReject){
return;
}


const {
error
} =
await supabase
.from("registration")
.update({

status:"rejected"

})
.eq("id",id);


if(error){

console.error(error);

alert(
"تعذر رفض الطلب ❌"
);

return;

}


loadRegistrations();

};


// ========================================
// DELETE
// ========================================

window.deleteRegistration =
async function(id){

const confirmDelete =
confirm(
"⚠️ هل أنت متأكد من حذف هذا الطلب نهائيًا؟"
);

if(!confirmDelete){
return;
}


const {
error
} =
await supabase
.from("registration")
.delete()
.eq("id",id);


if(error){

console.error(error);

alert(
"تعذر حذف الطلب ❌"
);

return;

}


loadRegistrations();

};


// ========================================
// START
// ========================================

checkSession();

</script>

</body>

</html>
```
