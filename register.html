```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>التسجيل | عصر الاحتراف</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;

}

}

}

.card{
background:#fff;

}

label{
display:block;

}

input,
textarea{
width:100%;
padding:15px;

textarea:focus{

}

height:110px;
resize:vertical;
}

.agePreview{

color:#d95700;
padding:12px;

margin-top:-8px;
margin-bottom:18px;

}

button{
width:100%;
padding:16px;
border:0;
border-radius:11px;
background:#ff6900;
color:#fff;

box-shadow:0 6px 15px rgba(255,105,0,.20);
}

button:hover{
background:#e85e00;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

#message{
text-align:center;
margin-top:18px;
line-height:1.8;
}

.success{
color:#00a844;
}

.error{
color:#d40000;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#777;
text-decoration:none;
}

.back:hover{

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="logo">
⚽
</div>

<h1>
التسجيل في
<span>عصر الاحتراف</span>
</h1>

<p>
سجل بيانات اللاعب وسيتم مراجعة الطلب من إدارة الأكاديمية.
</p>

</div>


<div class="card">

<form id="registrationForm">

<label>
اسم اللاعب
</label>

<input
id="player_name"
type="text"
placeholder="اكتب اسم اللاعب"
required
>


<label>
تاريخ الميلاد
</label>

<input
id="birth_date"
type="date"
required
>

<div
id="agePreview"
class="agePreview"
>
سيتم حساب العمر وسنة الميلاد تلقائيًا.
</div>


<label>
اسم ولي الأمر
</label>

<input
id="guardian_name"
type="text"
placeholder="اكتب اسم ولي الأمر"
required
>


<label>
رقم الجوال
</label>

<input
id="phone"
type="tel"
placeholder="05xxxxxxxx"
required
>


<label>
الملاحظات
</label>

<textarea
id="notes"
placeholder="أي معلومات إضافية..."
></textarea>


<button
id="submitBtn"
type="submit"
>
إرسال طلب التسجيل 📨
</button>

<div id="message"></div>

</form>

</div>


<a
class="back"
href="index.html"
>
← العودة للموقع
</a>

</div>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://ybbyvxpvblbnhqmkfxvw.supabase.co";


const SUPABASE_KEY =
"sb_publishable_zLOmmutAi-0PJ5xDqGzJug_Z4KtLLoW";


const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const form =
document.getElementById("registrationForm");

const submitBtn =
document.getElementById("submitBtn");

const birthDateInput =
document.getElementById("birth_date");

const agePreview =
document.getElementById("agePreview");


function calculateAge(dateString){

const birthDate =
new Date(dateString + "T00:00:00");

const today =
new Date();

let age =
today.getFullYear()
-
birthDate.getFullYear();

const month =
today.getMonth()
-
birthDate.getMonth();

if(
month < 0 ||
(
month === 0 &&
today.getDate() < birthDate.getDate()
)
){
age--;
}

return {
age:age,
birthYear:birthDate.getFullYear()
};

}


birthDateInput.addEventListener(
"change",
function(){

const result =
calculateAge(
birthDateInput.value
);

agePreview.innerText =
`العمر: ${result.age} سنة — مواليد ${result.birthYear}`;

});


form.addEventListener(
"submit",
async function(event){

event.preventDefault();

submitBtn.disabled = true;

submitBtn.innerText =
"جاري إرسال الطلب...";


const player_name =
document
.getElementById("player_name")
.value
.trim();

const birth_date =
birthDateInput.value;

const guardian_name =
document
.getElementById("guardian_name")
.value
.trim();

const phone =
document
.getElementById("phone")
.value
.trim();

const notes =
document
.getElementById("notes")
.value
.trim();


const result =
calculateAge(
birth_date
);


const { error } =
await supabase
.from("registration")
.insert([{

player_name: player_name,

birth_date: birth_date,

age: result.age,

guardian_name: guardian_name,

phone: phone,

notes: notes,

status: "pending"

}]);


if(error){

console.error(error);

submitBtn.disabled = false;

submitBtn.innerText =
"إرسال طلب التسجيل 📨";

document.getElementById(
"message"
).className = "error";

document.getElementById(
"message"
).innerText =
"تعذر إرسال الطلب ❌ حاول مرة أخرى.";

return;

}


document.querySelector(
".card"
).innerHTML = `

<div style="
text-align:center;
padding:45px 15px;
">

<div style="
font-size:65px;
margin-bottom:15px;
">
✅
</div>

<h2 style="
color:#00a844;
font-size:27px;
">
تم إرسال طلبك بنجاح
</h2>

<p style="
color:#777;
line-height:1.9;
font-size:16px;
">
تم استلام بيانات اللاعب بنجاح.<br>
سيتم مراجعة الطلب من إدارة الأكاديمية.
</p>

<a
href="index.html"
style="
display:inline-block;
margin-top:20px;
padding:13px 25px;
background:#ff6900;
color:white;
text-decoration:none;
border-radius:10px;
font-weight:bold;
"
>
العودة للموقع
</a>

</div>

`;

});

</script>

</body>

</html>
```
